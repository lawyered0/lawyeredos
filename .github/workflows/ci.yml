name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event.repository.private == false }}
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Check out source without stored credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use tested Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pinned test dependencies
        run: python -m pip install -r requirements-lock.txt -r requirements-test.txt

      - name: Run LawyeredOS tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Run vendored redline tests
        run: python -m pytest vendor/legal-redline-tools/tests -q

      - name: Run fictional setup smoke test
        run: python scripts/smoke_setup_wizard.py

      - name: Build and privacy-scan source archive
        run: |
          python scripts/build_release.py --output "$RUNNER_TEMP/lawyeredos-source.zip"
          python scripts/privacy_audit.py "$RUNNER_TEMP/lawyeredos-source.zip"
          unzip -t "$RUNNER_TEMP/lawyeredos-source.zip"
