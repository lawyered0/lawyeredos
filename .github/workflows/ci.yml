name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event.repository.private == false }}
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Check out source without stored credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Use tested Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install pinned test dependencies
        run: python -m pip install -r requirements-lock.txt -r requirements-test.txt

      - name: Run LawyeredOS tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Run fictional host-route mail acceptance
        env:
          PYTHONPATH: src
        run: python scripts/accept_mail_host_routes.py

      - name: Run vendored redline tests
        run: python -m pytest vendor/legal-redline-tools/tests -q

      - name: Run fictional setup smoke test
        run: python scripts/smoke_setup_wizard.py

      - name: Build and privacy-scan source archive
        run: |
          python scripts/build_release.py --output "$RUNNER_TEMP/lawyeredos-source.zip"
          python scripts/privacy_audit.py "$RUNNER_TEMP/lawyeredos-source.zip"
          unzip -t "$RUNNER_TEMP/lawyeredos-source.zip"
