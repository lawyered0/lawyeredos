name: Bug report
description: Report a reproducible LawyeredOS defect using fictional or fully sanitized data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never include client data, credentials, private paths, account identifiers, or unredacted logs. Use a fictional reproduction.
  - type: input
    id: version
    attributes:
      label: LawyeredOS version
      placeholder: 0.2.0
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Setup or launch
        - Matter orientation
        - Tracker
        - Letters or document rendering
        - Contract redline
        - Review workflow
        - Optional integration
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Fictional reproduction steps
      description: Replace all real details with minimal fictional values.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: macOS, Python, Claude Code, and relevant optional-tool versions only.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed client data, credentials, account identifiers, personal paths, and confidential screenshots.
          required: true
